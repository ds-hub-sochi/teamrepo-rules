interface:
  display_name: "Реестр моделей команды"
  short_description: "Кто, где и зачем использует модели: код, владельцы и риски"
  default_prompt: "Используй $model-usage-audit: проследи по коду бизнес-задачи и входы/выходы моделей, отдельно исследуй модели на Hugging Face или у автора, назначь ответственным владельца репозитория GitHub. Покажи общий дашборд и детализацию со ссылками на код и model cards; явно обозначь неразобранные находки, пробелы покрытия и проверки устаревания."
